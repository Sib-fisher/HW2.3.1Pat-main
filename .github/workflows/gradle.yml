name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1

    # 1. Запускаем наше приложение в фоне
    - name: Start Application
      run: |
        java -jar artifacts/app-replan-delivery.jar &
        sleep 10 # Ждем 10 секунд, чтобы приложение успело запуститься

    # 2. Запускаем тесты (в headless режиме)
    - name: Run Tests
      run: ./gradlew test -Dselenide.headless=true

    # 3. Сохраняем отчет Allure (если нужно)
    - name: Generate Allure Report
      if: always()
      run: ./gradlew allureReport

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: build/reports/allure-report/allureReport
